# TCP přeposílání VLAN_IP:port → 127.0.0.1:port (node 9100, dcgm 9400, vLLM 8000, ai-gateway 8080, ComfyUI 8188)
global
  log stdout format raw local0 warning
defaults
  mode tcp
  timeout connect 5s
  timeout client 5m
  timeout server 5m
frontend node
  bind "${VLAN_IP}:9100"
  default_backend node
backend node
  server s 127.0.0.1:9100
frontend dcgm
  bind "${VLAN_IP}:9400"
  default_backend dcgm
backend dcgm
  server s 127.0.0.1:9400
frontend vllm
  bind "${VLAN_IP}:8000"
  default_backend vllm
backend vllm
  server s 127.0.0.1:8000
frontend gateway
  bind "${VLAN_IP}:8080"
  default_backend gateway
backend gateway
  server s 127.0.0.1:8080
frontend comfy
  bind "${VLAN_IP}:8188"
  default_backend comfy
backend comfy
  server s 127.0.0.1:8188
