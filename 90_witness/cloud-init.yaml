#cloud-config
# Witness / bastion (Ubuntu 24.04). Šablona: ${...} doplní render.sh z witness.env.
# Fáze 2 plánu: jen klíče, bez roota a hesel, ufw, unattended-upgrades, fail2ban; docker pro monitoring.
hostname: witness
users:
  - name: ol1n
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys: ["${SSH_PUBKEY}"]
disable_root: true
ssh_pwauth: false
package_update: true
package_upgrade: true
packages: [ufw, fail2ban, unattended-upgrades, docker.io, docker-compose-v2, jq, curl]
write_files:
  - path: /etc/ssh/sshd_config.d/10-witness.conf
    content: |
      Port ${SSH_PORT}
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers ol1n
      # bastion: ProxyJump potřebuje TCP forwarding, X11/agent ne
      AllowTcpForwarding yes
      X11Forwarding no
      AllowAgentForwarding no
  - path: /etc/fail2ban/jail.d/sshd.local
    content: |
      [sshd]
      enabled = true
      port = ${SSH_PORT}
      maxretry = 5
      bantime = 1h
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ${SSH_PORT}/tcp
  - ufw allow in from ${L40S_VLAN_IP}
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now docker fail2ban unattended-upgrades
