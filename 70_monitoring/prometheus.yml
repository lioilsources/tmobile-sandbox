global: { scrape_interval: 15s }
scrape_configs:
  - { job_name: dcgm,  static_configs: [{ targets: ["dcgm:9400"] }] }
  - { job_name: node,  static_configs: [{ targets: ["node:9100"] }] }
  - { job_name: vllm,  static_configs: [{ targets: ["vllm:8000", "vllm-embed:8000"] }] }
  - { job_name: ai-gateway, static_configs: [{ targets: ["ai-gateway:8080"] }] }
