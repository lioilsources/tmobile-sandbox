# GPU služby, rozdělené do VRAM profilů (48 GB neudrží vše naráz). Přepínání: ./switch.sh A|B|C|D|off
# Všechny porty jen na 127.0.0.1 (Docker obchází ufw) → přístup přes SSH tunel.
name: gpu
x-vllm: &vllm
  image: vllm/vllm-openai:${VLLM_TAG:-latest}
  ipc: host
  restart: unless-stopped
  volumes: ["/srv/hf:/root/.cache/huggingface"]
  environment: { HF_HUB_OFFLINE: "1" }
  networks: [tms]
  deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
  healthcheck: { test: ["CMD", "curl", "-sf", "localhost:8000/health"], interval: 15s, start_period: 600s }

services:
  # --- A „LLM“: Qwen3-32B-FP8, ctx 32k (fp8 KV → ~60k tokenů cache)
  llm-a:
    <<: *vllm
    profiles: [A]
    container_name: vllm
    ports: ["127.0.0.1:8000:8000"]
    command: >-
      --model Qwen/Qwen3-32B-FP8 --served-model-name qwen3-32b
      --max-model-len 32768 --gpu-memory-utilization 0.92 --kv-cache-dtype fp8
      --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3

  # --- B „API mix“: MoE 30B-A3B + embeddings + Whisper
  embed-b:
    <<: *vllm
    profiles: [B]
    container_name: vllm-embed
    ports: ["127.0.0.1:8002:8000"]
    command: >-
      --model Qwen/Qwen3-Embedding-0.6B --served-model-name qwen3-embed
      --runner pooling --max-model-len 8192 --gpu-memory-utilization 0.07
  llm-b:
    <<: *vllm
    profiles: [B]
    container_name: vllm
    depends_on: { embed-b: { condition: service_healthy } }
    ports: ["127.0.0.1:8000:8000"]
    command: >-
      --model Qwen/Qwen3-30B-A3B-Instruct-2507-FP8 --served-model-name qwen3-30b-a3b
      --max-model-len 32768 --gpu-memory-utilization 0.80 --kv-cache-dtype fp8
      --enable-auto-tool-choice --tool-call-parser hermes

  # --- C „Dokumenty“: Qwen3-VL-32B FP8
  vl-c:
    <<: *vllm
    profiles: [C]
    container_name: vllm
    ports: ["127.0.0.1:8000:8000"]
    command: >-
      --model Qwen/Qwen3-VL-32B-Instruct-FP8 --served-model-name qwen3-vl-32b
      --max-model-len 16384 --gpu-memory-utilization 0.93 --kv-cache-dtype fp8
      --limit-mm-per-prompt '{"image":4,"video":0}'

  # --- O „OCR engine“: libovolný VLM pro UC1 (OCR_MODEL=… ./switch.sh O)
  ocr-o:
    <<: *vllm
    profiles: [O]
    container_name: vllm
    ports: ["127.0.0.1:8000:8000"]
    command: >-
      --model ${OCR_MODEL:-Qwen/Qwen3-VL-8B-Instruct} --served-model-name ocr
      --max-model-len ${OCR_MAXLEN:-16384} --gpu-memory-utilization 0.92
      --limit-mm-per-prompt '{"image":1,"video":0}' ${OCR_ARGS:-}

  # --- Whisper (B i D), OpenAI-kompatibilní /v1/audio/transcriptions
  whisper:
    image: ghcr.io/speaches-ai/speaches:${SPEACHES_TAG:-latest-cuda}
    profiles: [B, D]
    container_name: whisper
    restart: unless-stopped
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["/srv/hf:/home/ubuntu/.cache/huggingface"]
    environment:
      HF_HUB_OFFLINE: "1"
      WHISPER__TTL: "-1"   # model se načte při 1. požadavku (smoke.sh) a už se neuvolní
      LOG_LEVEL: info
    networks: [tms]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

networks:
  tms: { external: true }
